<style>
:root{--bg:#0e1412;--panel:#17201b;--line:#303c32;--muted:#a0afa1;--gold:#e4c47b;--green:#b0d698;--white:#eef1e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:14px/1.55 system-ui,Arial}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#263328;color:var(--white);padding:10px 14px;border-radius:7px}button:hover{border-color:var(--gold);background:#344334}button:disabled{opacity:.42;cursor:not-allowed}button.primary{background:var(--gold);color:#202315;border-color:var(--gold);font-weight:750}button.active{border-color:var(--gold);color:var(--gold)}input,select{background:#101813;color:var(--white);border:1px solid #465245;border-radius:5px;padding:9px;max-width:100%}input[type=color]{padding:3px;width:60px;height:40px}h1,h2,h3,p{margin:0 0 12px}h1{font-size:clamp(26px,3vw,42px);line-height:1.1;letter-spacing:-1.5px}h2{font-size:23px;letter-spacing:-.5px}h3{font-size:16px}small,.muted{color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800}.shell{display:grid;grid-template-columns:218px 1fr;min-height:100vh}aside{padding:28px 18px;border-right:1px solid var(--line);background:#121b15;display:flex;flex-direction:column;gap:22px}.brand{font-size:34px;font-weight:950;font-style:italic;line-height:1}.brand span{color:var(--gold)}.brand small{display:block;font-size:10px;letter-spacing:3px;font-style:normal;margin-top:11px}nav{display:grid;gap:7px}nav button{text-align:left;background:none;border-color:transparent;padding:12px}nav button.active{background:#273126}.aside-bottom{margin-top:auto;color:var(--muted);font-size:12px}.topbar{border-bottom:1px solid var(--line);padding:17px 30px;display:flex;justify-content:space-between;gap:15px;align-items:center}.stats{display:flex;gap:30px}.stat strong{display:block;font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums}.stat small{font-size:10px;text-transform:uppercase;letter-spacing:1px}main{padding:26px 30px;max-width:1600px;margin:auto}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.tag{display:inline-block;padding:4px 9px;border:1px solid var(--line);border-radius:20px;color:var(--green);font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:20px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;overflow:hidden}.card.accent{border-top:3px solid var(--gold)}.row{display:flex;justify-content:space-between;gap:15px;align-items:center}.stack{display:grid;gap:13px}.metric{font-size:34px;font-weight:700;color:var(--gold);letter-spacing:-1px}.bar{height:5px;background:#344135;border-radius:4px;margin:12px 0}.bar i{display:block;height:100%;background:var(--green);border-radius:4px}.gap{margin-top:20px}.actions{display:flex;gap:8px;flex-wrap:wrap}.map-wrap{background:#202e20;position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden}.map-top{padding:14px 18px;background:#17231c;display:flex;justify-content:space-between;align-items:center}.map{display:grid;grid-template-columns:repeat(12,1fr);padding:18px;gap:3px;background:radial-gradient(ellipse at center,#344b2c,#203121)}.tile{min-width:0;aspect-ratio:1;border-radius:3px;padding:0;border:1px solid #52614570;background:#74955614;position:relative;font-size:clamp(9px,1.8vw,21px);display:flex;align-items:center;justify-content:center}.tile:hover{background:#b4cb7060}.tile.lock{background:#0a140b70;border-style:dashed;opacity:.55}.tile.building{background:#536657;border:2px solid #c1c8a2;box-shadow:3px 4px 0 #0005}.tile.building:after{content:attr(data-level);position:absolute;right:2px;bottom:0;font-size:8px;color:#ffecb4}.tile.road{background:#4c5147;border-color:#a7a789}.tile.selected{outline:2px solid var(--gold)}.catalog{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.catalog button{text-align:left;font-size:12px;padding:12px}.catalog button b{display:block}.catalog button span{font-size:10px;color:var(--muted)}.map-help{font-size:12px;color:var(--muted);padding:12px 16px;background:#17231c}.notice{border-left:3px solid var(--gold);padding:12px 16px;background:#253024;margin:16px 0}.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.list-row:last-child{border-bottom:0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase}.you{color:var(--gold);background:#e4c47b0c}.race-layout{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(230px,1fr);gap:18px}canvas{display:block;width:100%;background:#233e2c;border-radius:8px}.live{color:var(--gold);font-size:11px;font-weight:700}.field{display:grid;gap:7px;margin:12px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#e4c47b;color:#1c2419;padding:13px 22px;border-radius:8px;z-index:20;box-shadow:0 8px 35px #0008;max-width:90%;font-weight:650}.hide{display:none!important}.pill{font-size:11px;border:1px solid var(--line);padding:3px 8px;border-radius:14px}.race-title{padding:14px;background:#18271c;display:flex;justify-content:space-between;gap:8px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.empty{padding:25px;text-align:center;color:var(--muted)}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}footer{padding:20px 30px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}.score{font-size:12px;color:var(--green)}.banner{background:linear-gradient(110deg,#32402a,#1a241c);border:1px solid #546246;border-radius:10px;padding:25px;position:relative;overflow:hidden}.banner:after{content:'ZFC';position:absolute;right:15px;top:-20px;font-size:140px;font-weight:950;font-style:italic;color:#ffffff05;pointer-events:none}.banner p{max-width:650px}.mono{font-variant-numeric:tabular-nums}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}@media(max-width:1050px){.shell{grid-template-columns:170px 1fr}aside{padding:22px 10px}.two,.race-layout{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{gap:15px}.topbar,main{padding:18px}.tile{font-size:20px}}@media(max-width:650px){.shell{display:block}aside{border-right:0;padding:14px}.brand{font-size:25px}.brand small,.aside-bottom,aside>.eyebrow{display:none}nav{display:flex;overflow-x:auto;gap:3px}nav button{white-space:nowrap;padding:9px;font-size:12px}aside{gap:10px}.topbar{align-items:start;flex-direction:column;padding:12px 16px}.stats{width:100%;justify-content:space-between;gap:7px}.stat strong{font-size:16px}main{padding:16px}.hero{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.map{padding:8px;gap:2px}.tile{font-size:15px}.card{padding:15px}h1{font-size:31px}.catalog{grid-template-columns:repeat(2,1fr)}footer{padding:14px}td,th{padding:8px 4px;font-size:11px}.toolbar{gap:5px}}
</style></head><body>
<div class="shell"><aside><div class="brand">ZFC<span>®</span><small>RACING EMPIRE</small></div><div class="eyebrow">Team Principal Console</div><nav id="nav"></nav><div class="aside-bottom"><span class="tag">BROWSER EDITION · 1.0</span><p class="gap">Deine Vision.<br>Dein Team. Dein Vermächtnis.</p><small>Einzelspieler · lokal gespeichert</small></div></aside><div><header class="topbar"><div><span class="eyebrow">ZFC MOTORSPORT GROUP</span><div id="teamTop"></div></div><div class="stats" id="stats"></div></header><main id="main"></main><footer>ZFC Racing Empire · Eigenständiges Browser-Tycoon · Automatischer lokaler Spielstand · Keine Anmeldung erforderlich</footer></div></div><div id="toast" role="status" class="toast hide"></div><input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
'use strict';
/* ZFC Racing Empire — self-contained, dependency-free. State is versioned for future backend integration. */
const KEY='zfc-racing-empire-v1', $=s=>document.querySelector(s), clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const buildings={workshop:{name:'Werkstatt',icon:'⚒',cost:180000,desc:'Reparatur & Fahrzeugvorbereitung',color:'#8aab9a'},lab:{name:'Entwicklungsbüro',icon:'◈',cost:320000,desc:'Schaltet Forschung frei',color:'#7097b0'},sim:{name:'Simulator',icon:'◉',cost:240000,desc:'Fahrertraining & Rennpace',color:'#b6a3c8'},marketing:{name:'Marketing',icon:'▥',cost:200000,desc:'Mehr Sponsoring pro Rennen',color:'#c2aa70'},solar:{name:'Solarpark',icon:'☀',cost:140000,desc:'Senkt laufende Gebäudekosten',color:'#9cae62'},academy:{name:'Akademie',icon:'★',cost:450000,desc:'Mehr Training & Reputation',color:'#a78066'},wind:{name:'Windkanal',icon:'≋',cost:650000,desc:'Günstigere Aero-Forschung',color:'#78b8b2'},road:{name:'Zufahrt',icon:'·',cost:2000,desc:'Freie Gestaltung des Geländes',color:'#5c6253'}};
const tracks=[{name:'Coastal Park',country:'GRIECHENLAND',type:'Ausgewogen',a:.33,m:.34,g:.33},{name:'Desert Ring',country:'BAHRAIN',type:'Motorleistung',a:.2,m:.55,g:.25},{name:'Sakura Circuit',country:'JAPAN',type:'Aerodynamik',a:.55,m:.2,g:.25},{name:'Harbour Street',country:'MONACO',type:'Mechanischer Grip',a:.3,m:.1,g:.6},{name:'Ardennes GP',country:'BELGIEN',type:'Highspeed',a:.4,m:.45,g:.15},{name:'Nightfall GP',country:'SINGAPUR',type:'Grip & Konstanz',a:.25,m:.15,g:.6}];
const rivals=[{name:'Apex Motorsport',color:'#e17865',base:66},{name:'Vortex Racing',color:'#63a9e1',base:61},{name:'Nova Competition',color:'#b39be8',base:56},{name:'Atlas Formula',color:'#e9ddd1',base:51},{name:'Orion Works',color:'#8ac6a0',base:46}];
const points=[25,18,15,12,10,8,6,4,2,1,0,0];
function fresh(){let tiles={};tiles['2,2']={type:'workshop',level:1};return {v:1,name:'Phoenix Racing',color:'#e4c47b',cash:4500000,xp:0,rep:0,season:1,round:0,races:0,wins:0,podiums:0,trained:0,researches:0,expansions:0,tiles,cols:6,rows:6,car:{motor:38,aero:35,grip:36,reliability:62,condition:100},staff:{engineer:0,mechanic:1},drivers:[{name:'Alex Moreau',skill:48,consistency:54},{name:'Jamie Costa',skill:44,consistency:58}],standings:[0,0,0,0,0,0],history:[],claimed:[],sponsor:null,log:['Das alte Phoenix-Team gehört jetzt dir. Dein Budget: 4,5 Mio. €.'],settings:{speed:2},pendingRace:null};}
let state=fresh(), storageOk=true;
try{let saved=localStorage.getItem(KEY);if(saved)state=validate(JSON.parse(saved));}catch(e){storageOk=false;}
let page='overview',buildMode='workshop',selected=null,race=null,lastFrame=0,toastTimer;
function validate(s){if(!s||s.v!==1||typeof s.name!=='string'||s.name.length>40||!/^#[0-9a-f]{6}$/i.test(s.color))throw Error('Ungültiges Format');const num=(x,a,b)=>typeof x==='number'&&Number.isFinite(x)&&x>=a&&x<=b;if(!num(s.cash,0,1e12)||!num(s.round,0,5)||!Number.isInteger(s.round)||!num(s.season,1,1e6))throw Error('Ungültiger Fortschritt');for(let k of ['xp','rep','races','wins','podiums','trained','researches','expansions'])if(!num(s[k],0,1e12))throw Error('Ungültige Statistik');if(![6,8,10,12].includes(s.cols)||s.rows!==s.cols||!s.tiles||typeof s.tiles!=='object')throw Error('Ungültige Karte');for(let [k,t]of Object.entries(s.tiles)){let xy=k.split(',').map(Number);if(xy.length!==2||xy.some(n=>!Number.isInteger(n)||n<0||n>=s.cols)||!buildings[t.type]||!Number.isInteger(t.level)||t.level<1||t.level>5)throw Error('Ungültiges Gebäude');}for(let k of ['motor','aero','grip','reliability','condition'])if(!num(s.car?.[k],0,100))throw Error('Ungültiges Auto');for(let k of ['engineer','mechanic'])if(!Number.isInteger(s.staff?.[k])||!num(s.staff[k],0,20))throw Error('Ungültiges Personal');if(!Array.isArray(s.drivers)||s.drivers.length!==2||s.drivers.some(d=>typeof d.name!=='string'||d.name.length>35||!num(d.skill,0,100)||!num(d.consistency,0,100)))throw Error('Ungültige Fahrer');if(!Array.isArray(s.standings)||s.standings.length!==6||s.standings.some(n=>!num(n,0,1e9)))throw Error('Ungültige Wertung');if(!Array.isArray(s.claimed)||s.claimed.some(n=>typeof n!=='number')||!Array.isArray(s.history)||!Array.isArray(s.log)||s.log.some(x=>typeof x!=='string')||s.log.length>100)throw Error('Ungültige Listen');s.history=s.history.slice(-24).map(h=>{if(!h||!num(h.season,1,1e6)||typeof h.track!=='string'||!num(h.p1,1,12)||!num(h.p2,1,12)||!num(h.reward,0,1e10))throw Error('Ungültige Historie');return h;});if(s.sponsor&&(!['Nexora','Velocity','Zenith'].includes(s.sponsor.name)||!num(s.sponsor.left,1,6)||!num(s.sponsor.base,0,1e7)||!num(s.sponsor.bonus,0,1e7)||!num(s.sponsor.target,1,12)))throw Error('Ungültiger Sponsor');s.settings={speed:[1,2,4].includes(s.settings?.speed)?s.settings.speed:2};/* Interrupted races roll back to the last pre-race save: no duplicated rewards. */s.pendingRace=null;return s;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOk=true;}catch(e){storageOk=false;}}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hide'),4000);}function log(t){state.log.unshift(t);state.log=state.log.slice(0,30);}function count(t){return Object.values(state.tiles).filter(x=>x.type===t).reduce((a,b)=>a+b.level,0);}function level(){return 1+Math.floor(state.xp/150);}function spend(n){if(state.cash<n){toast('Dafür reicht das Budget noch nicht.');return false;}state.cash-=n;return true;}function upkeep(){return Math.max(18000,Object.values(state.tiles).reduce((a,t)=>a+(t.type==='road'?0:6000*t.level),0)+state.staff.engineer*14000+state.staff.mechanic*9000+24000-count('solar')*14000);}function pace(){let t=tracks[state.round];return Math.round((state.car.motor*t.m+state.car.aero*t.a+state.car.grip*t.g)*.65+(state.drivers[0].skill+state.drivers[1].skill)/2*.25+Math.min(10,count('sim')*2+state.staff.engineer));}
const quests=[{title:'Ein neues Kapitel',desc:'Gib deinem Team in den Einstellungen einen eigenen Namen.',test:()=>state.name!=='Phoenix Racing',reward:100000,xp:50},{title:'Ideen werden Leistung',desc:'Baue ein Entwicklungsbüro auf dem Campus.',test:()=>count('lab')>0,reward:180000,xp:80},{title:'Das beste Team hinter dem Team',desc:'Stelle mindestens einen Ingenieur ein.',test:()=>state.staff.engineer>0,reward:120000,xp:50},{title:'Lichter aus!',desc:'Beende dein erstes Rennen.',test:()=>state.races>=1,reward:250000,xp:100},{title:'Ein Schritt voraus',desc:'Erforsche drei Fahrzeug-Upgrades.',test:()=>state.researches>=3,reward:220000,xp:100},{title:'Raum für Visionen',desc:'Erweitere das Grundstück einmal.',test:()=>state.expansions>=1,reward:200000,xp:100},{title:'Talente formen',desc:'Trainiere deine Fahrer dreimal.',test:()=>state.trained>=3,reward:180000,xp:80},{title:'Der Duft von Champagner',desc:'Erreiche mit einem Auto das Podium.',test:()=>state.podiums>=1,reward:400000,xp:150},{title:'Vom Team zum Empire',desc:'Absolviere eine komplette Saison (6 Rennen).',test:()=>state.races>=6,reward:650000,xp:250},{title:'Ganz oben',desc:'Gewinne ein Rennen.',test:()=>state.wins>=1,reward:800000,xp:300}];
const tabs=[['overview','◫','Kommandozentrale'],['campus','▦','HQ & Gelände'],['team','♟','Team & Fahrer'],['research','◈','Fahrzeug & Forschung'],['race','⚑','Rennwochenende'],['quests','✧','Story & Quests'],['finance','◎','Finanzen'],['settings','⚙','Spielstand']];
function header(){ $('#teamTop').textContent=state.name+' · Saison '+state.season;$('#stats').innerHTML=`<div class="stat"><small>Budget</small><strong>${money(state.cash)}</strong></div><div class="stat"><small>Teamlevel</small><strong>LV. ${level()}</strong></div><div class="stat"><small>Reputation</small><strong>${state.rep} RP</strong></div><div class="stat"><small>Saisonfortschritt</small><strong>${state.round+1} / 6</strong></div>`;$('#nav').innerHTML=tabs.map(([id,i,n])=>`<button data-page="${id}" class="${page===id?'active':''}">${i} &nbsp; ${n}${id==='quests'&&quests.some((q,i)=>q.test()&&!state.claimed.includes(i))?' •':''}</button>`).join('');}
function hero(k,title,desc,extra=''){return `<div class="hero"><div><div class="eyebrow">${k}</div><h1>${title}</h1><div class="muted">${desc}</div></div>${extra}</div>`;}function bar(n){return `<div class="bar"><i style="width:${clamp(n,0,100)}%"></i></div>`;}
function render(){header();let html='';if(page==='overview'){html=hero('BUILD YOUR LEGACY',`Willkommen, Team Principal.`,`Dein nächstes Kapitel beginnt in ${tracks[state.round].name}.`,`<button class="primary" data-page="race">Zum Rennwochenende ↗</button>`)+`<div class="banner"><div class="eyebrow">KAPITEL ${Math.min(5,state.season)} / DER AUFSTIEG</div><h2>${['Der Neustart','Der Durchbruch','Das Werksteam','Die Herausforderung','Das Racing Empire'][Math.min(4,state.season-1)]}</h2><p class="muted">Eine alte Werkstatt. Zwei hungrige Fahrer. Eine große Vision. Entwickle dein Auto, erweitere deinen Campus und bringe dein Team an die Spitze der ZFC.</p><button data-page="quests">Deine Missionen ansehen →</button></div><div class="grid gap"><div class="card"><div class="eyebrow">FAHRZEUG</div><div class="metric">${pace()} <small style="font-size:14px">/ 100</small></div><p>Streckenspezifische Teamstärke</p>${bar(pace())}<small>Zustand ${Math.round(state.car.condition)} % · Zuverlässigkeit ${state.car.reliability} %</small></div><div class="card"><div class="eyebrow">DEIN CAMPUS</div><div class="metric">${Object.values(state.tiles).filter(t=>t.type!=='road').length}</div><p>Gebäude auf ${state.cols*state.rows} Bauplätzen</p><button data-page="campus">Campus öffnen →</button></div><div class="card"><div class="eyebrow">RENNBILANZ</div><div class="metric">${state.wins} <small style="font-size:14px">Siege</small></div><p>${state.races} Rennen · ${state.podiums} Podiumsplätze</p><span class="tag">${state.standings[0]} WM-Punkte</span></div></div><div class="two gap"><div class="card"><h3>Das ist dein nächster Schritt</h3>${quests.filter((q,i)=>!state.claimed.includes(i)).slice(0,3).map(q=>`<div class="list-row"><div><b>${q.title}</b><div class="muted">${q.desc}</div></div><span class="pill">${q.test()?'Abholbereit':'Offen'}</span></div>`).join('')||'<p>Alle Story-Ziele erfüllt. Baue dein Vermächtnis weiter aus!</p>'}</div><div class="card"><h3>Teamfunk</h3>${state.log.slice(0,4).map(t=>`<p class="muted">${esc(t)}</p>`).join('')}</div></div>`;}
if(page==='campus'){html=hero('YOUR EMPIRE / MASTERPLAN','Ein Zuhause für Sieger.','Wähle ein Gebäude und klicke auf ein freies Feld. Bestehende Gebäude kannst du ausbauen.')+`<div class="two"><div><div class="map-wrap"><div class="map-top"><b>${esc(state.name)} Campus</b><span class="tag">${state.cols} × ${state.rows} erschlossen</span></div><div class="map">${Array.from({length:144},(_,i)=>{let x=i%12,y=Math.floor(i/12),t=state.tiles[x+','+y],locked=x>=state.cols||y>=state.rows;return `<button class="tile ${locked?'lock':t?'building '+(t.type==='road'?'road':''):''} ${selected===x+','+y?'selected':''}" data-tile="${x},${y}" data-level="${t?'L'+t.level:''}" title="${locked?'Grundstück noch nicht gekauft':t?buildings[t.type].name+' Stufe '+t.level:'Freier Bauplatz'}" aria-label="${x+1}, ${y+1}: ${locked?'gesperrt':t?buildings[t.type].name:'frei'}">${locked?'·':t?buildings[t.type].icon:''}</button>`;}).join('')}</div><div class="map-help">▦ Bauland &nbsp; · Gesperrtes Gelände &nbsp; | &nbsp; Gebäude funktionieren direkt nach dem Bau. Zufahrten sind in dieser Version dekorativ.</div></div><div class="card gap"><div class="row"><div><h3>Dein Horizont wächst.</h3><div class="muted">${state.cols<12?'Nächster Ausbau: '+(state.cols+2)+' × '+(state.rows+2)+' Bauplätze':'Das gesamte Gelände ist erschlossen.'}</div></div><button data-action="expand" ${state.cols>=12?'disabled':''}>${state.cols<12?money(expandCost())+' · Erweitern':'Maximalgröße'}</button></div></div></div><div class="stack"><div class="card"><div class="eyebrow">BAUKATALOG</div><h3>Die Grundlage deines Erfolgs</h3><div class="catalog">${Object.entries(buildings).map(([id,b])=>`<button data-build="${id}" class="${buildMode===id?'active':''}"><b>${b.icon} ${b.name}</b><span>${money(b.cost)}</span></button>`).join('')}</div><p class="muted gap">${buildings[buildMode].desc}</p></div><div class="card">${selected&&state.tiles[selected]?selectedCard():`<h3>Campus entwickeln</h3><p class="muted">Jedes Gebäude belegt function selectedCard(){let t=state.tiles[selected],b=buildings[t.type];return `<div class="eyebrow">GEWÄHLTES GEBÄUDE</div><h3>${b.icon} ${b.name} · Stufe ${t.level}</h3><p class="muted">${b.desc}</p><div class="stack"><button data-action="upgrade" ${t.level>=5||t.type==='road'?'disabled':''}>Ausbauen · ${money(b.cost*t.level*.65)}</button><button data-action="demolish">Abreißen · 35 % Rückerstattung</button></div>`;}function expandCost(){return 400000*(state.expansions+1);}function trainingGain(){return Math.min(7,2+count('sim')+count('academy'));}function researchGain(){return Math.min(8,2+count('lab')+Math.floor(state.staff.engineer/2));}function researchCost(k){return Math.round((65000+state.car[k]*1800)*(k==='aero'?Math.max(.6,1-count('wind')*.1):1));}function repairCost(){return Math.ceil((100-state.car.condition)*2300/(1+count('workshop')*.12));}function sponsors(){return [{name:'Nexora',base:90000,bonus:65000,target:10},{name:'Velocity',base:55000,bonus:170000,target:6},{name:'Zenith',base:25000,bonus:350000,target:3}];}

function racePage(){let round=race?race.round:state.round,t=tracks[round];return hero('ZFC CHAMPIONSHIP / ROUND '+(round+1),t.name,`${t.country} · 12 Runden · 12 Autos · Schwerpunkt: ${t.type}`,`<span class="tag">Saison ${race?race.season:state.season}</span>`)+`<div class="race-layout"><div class="card" style="padding:0"><div class="race-title"><b id="raceStatus">${race?race.finished?'ZIELFLAGGE':'RENNEN LÄUFT':'BEREIT FÜR DEN START'}</b><span class="live" id="raceLap">${race?'':'HELIKOPTER-KAMERA · LIVE SIMULATION'}</span></div><canvas id="track" width="1000" height="590" aria-label="Animierte Rennstrecke in Helikopterperspektive"></canvas><div style="padding:16px"><div class="toolbar"><button class="primary" data-action="start" ${race?'disabled':''}>Rennen starten · 40.000 €</button><label>Tempo <select id="speed"><option value="1" ${state.settings.speed===1?'selected':''}>1×</option><option value="2" ${state.settings.speed===2?'selected':''}>2×</option><option value="4" ${state.settings.speed===4?'selected':''}>4×</option></select></label><label>Fahrstil <select id="style"><option value="balanced">Ausgewogen</option><option value="attack">Angreifen</option><option value="save">Schonen</option></select></label><label>Stopp <select id="pit"><option value="5">Früh · Runde 5</option><option value="6" selected>Normal · Runde 6</option><option value="8">Spät · Runde 8</option></select></label><button data-action="pause" ${!race||race.finished?'disabled':''}>${race?.paused?'Fortsetzen':'Pause'}</button>${race?.finished?'<button class="primary" data-action="next">Zum nächsten Rennen →</button>':''}</div><p class="muted gap" id="raceMessage">${race?.message?esc(race.message):'Ein Boxenstopp je Auto. Wetter und Strategie beeinflussen das Rennen. Du kannst den Fahrstil während des Rennens ändern.'}</p><div class="legend">${[{name:state.name,color:state.color},...rivals].map(t=>`<span><i class="dot" style="background:${t.color}"></i>${esc(t.name)}</span>`).join('')}</div></div></div><div class="stack"><div class="card"><h3>Live-Timing</h3><div id="timing">${race?timingHTML():'<p class="muted">Das Feld wartet auf die Startfreigabe.</p>'}</div></div><div class="card"><div class="eyebrow">RENNINGENIEUR</div><h3>Teamstärke ${pace()} / 100</h3><p class="muted">Zustand ${Math.round(state.car.condition)} %<br>Rennbetrieb: ${money(upkeep())}<br>Sponsor: ${state.sponsor?state.sponsor.name:'Keiner'}</p><button data-page="research">Vorbereitung & Wartung →</button></div></div></div><div class="two gap"><div class="card"><h3>Konstrukteursmeisterschaft</h3>${standingsTable()}</div><div class="card"><h3>Saisonkalender</h3>${tracks.map((t,i)=>`<div class="list-row"><span>${i<state.round?'✓':i===state.round?'→':'○'} ${t.name}</span><span class="muted">${i+1} / 6</span></div>`).join('')}</div></div>`;}
// Track is a closed, smoothly interpolated circuit. Simulation progress is measured in laps.
const control=[[.21,.77],[.12,.66],[.10,.35],[.18,.20],[.39,.17],[.51,.28],[.67,.18],[.85,.24],[.89,.41],[.76,.49],[.84,.69],[.70,.80],[.56,.67],[.43,.80]];
const path=[];for(let i=0;i<control.length;i++){let a=control[(i-1+control.length)%control.length],b=control[i],c=control[(i+1)%control.length],d=control[(i+2)%control.length];for(let j=0;j<50;j++){let t=j/50,t2=t*t,t3=t2*t;path.push([0,1].map(k=>.5*((2*b[k])+(-a[k]+c[k])*t+(2*a[k]-5*b[k]+4*c[k]-d[k])*t2+(-a[k]+3*b[k]-3*c[k]+d[k])*t3)));}}
// Resample by distance so cars do not accelerate artificially in sparse curve sections.
const lengths=[0];for(let i=1;i<=path.length;i++){let a=path[i-1],b=path[i%path.length];lengths.push(lengths[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]));}const totalLength=lengths.at(-1);function position(p){let dist=((p%1)+1)%1*totalLength;let lo=0,hi=path.length;while(lo+1<hi){let m=(lo+hi)>>1;if(lengths[m]<=dist)lo=m;else hi=m;}let a=path[lo],b=path[(lo+1)%path.length],t=(dist-lengths[lo])/(lengths[lo+1]-lengths[lo]);return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,Math.atan2((b[1]-a[1])*590,(b[0]-a[0])*1000)];}
function drawTrack(){let canvas=$('#track');if(!canvas)return;let ctx=canvas.getContext('2d'),w=1000,h=590;ctx.clearRect(0,0,w,h);ctx.fillStyle='#243e2c';ctx.fillRect(0,0,w,h);for(let i=0;i<65;i++){let x=(i*157+33)%1000,y=(i*93+23)%590;ctx.fillStyle=i%2?'#2c4932':'#203726';ctx.beginPath();ctx.arc(x,y,12+i%9,0,Math.PI*2);ctx.fill();}function line(color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';ctx.beginPath();path.forEach((p,i)=>i?ctx.lineTo(p[0]*w,p[1]*h):ctx.moveTo(p[0]*w,p[1]*h));ctx.closePath();ctx.stroke();}line('#111e17',61);line('#d8c9a5',48);line('#b65948',43);line('#535b56',35);ctx.setLineDash([7,13]);line('#e8e2c350',1);ctx.setLineDash([]);ctx.fillStyle='#d9dfc50d';ctx.font='italic 900 77px Arial';ctx.textAlign='center';ctx.fillText('ZFC',480,321);ctx.font='13px Arial';ctx.fillStyle='#b1c2a0';ctx.fillText('R A C I N G   E M P I R E',480,348);ctx.fillStyle='#72826a';ctx.fillRect(276,477,170,35);ctx.fillStyle='#c1c7ae';ctx.fillRect(285,483,152,5);ctx.font='12px Arial';ctx.fillText('PIT LANE',360,503);let start=position(0);ctx.save();ctx.translate(start[0]*w,start[1]*h);ctx.rotate(start[2]);for(let i=0;i<2;i++)for(let j=0;j<6;j++){ctx.fillStyle=(i+j)%2?'#17211b':'#f6edcf';ctx.fillRect(i*5-5,j*6-18,5,6);}ctx.restore();let cars=race?race.cars:Array.from({length:12},(_,i)=>({progress:-i*.005,team:Math.floor(i/2),number:i+1}));cars.forEach(c=>{let p=position(c.progress),offset=(c.number%2?1:-1)*5;ctx.save();ctx.translate(p[0]*w-Math.sin(p[2])*offset,p[1]*h+Math.cos(p[2])*offset);ctx.rotate(p[2]);ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillStyle='#0d1410';ctx.fillRect(-9,-7,5,4);ctx.fillRect(-9,3,5,4);ctx.fillRect(4,-7,5,4);ctx.fillRect(4,3,5,4);ctx.fillStyle=c.team===0?state.color:rivals[c.team-1].color;ctx.fillRect(-9,-3,18,6);ctx.fillRect(6,-7,3,14);ctx.fillRect(-10,-6,3,12);ctx.fillStyle='#17211a';ctx.fillRect(-2,-2,5,4);ctx.restore();if(c.team===0){ctx.fillStyle=state.color;ctx.font='bold 11px Arial';ctx.fillText(c.number===26?'26':'27',p[0]*w,p[1]*h-15);}});if(race?.weather==='rain'){ctx.strokeStyle='#b1d3ec60';ctx.lineWidth=1;for(let i=0;i<100;i++){let x=(i*83+race.time*90)%1000,y=(i*47+race.time*180)%590;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6,y+12);ctx.stroke();}}}
function startRace(){if(race)return;if(state.car.condition<25){toast('Bitte warte deine Autos zuerst. Mindestens 25 % Zustand erforderlich.');return;}if(state.cash<40000+upkeep()){toast('Reserviere das Startgeld und die laufenden Kosten vor dem Rennen.');return;}const style=$('#style').value,pit=Number($('#pit').value);save();let weather=Math.random()<.22?'rain':'dry';race={round:state.round,season:state.season,time:0,finished:false,paused:false,weather,style,pit,message:weather==='rain'?'Regen! Konstanz und Grip sind heute besonders wichtig.':'Trockene Strecke. Das Rennen ist freigegeben.',cars:[],events:[]};for(let team=0;team<6;team++)for(let d=0;d<2;d++){let strength=team===0?pace():rivals[team-1].base+Math.min(20,(state.season-1)*4)+(d? -2:2);race.cars.push({team,number:team===0?26+d:team*10+d,driver:team===0?state.drivers[d].name:['L. Vega','R. Sato','M. Laurent','K. Berg','I. Rossi','T. Kim','E. Silva','N. Quinn','J. Hart','S. Chen'][(team-1)*2+d],strength:strength+(Math.random()-.5)*3,consistency:team===0?state.drivers[d].consistency:65,progress:-((team*2+d)*.003),stopped:false,pitTimer:0,finish:null,lap:0,incidentLap:-1});}render();$('#style').value=style;$('#pit').value=pit;toast('Start frei! '+(weather==='rain'?'Regenrennen.':'Trockene Bedingungen.'));}
function order(){return race.cars.slice().sort((a,b)=>a.finish!==null&&b.finish!==null?a.finish-b.finish:a.finish!==null?-1:b.finish!==null?1:b.progress-a.progress);}function timingHTML(){return `<table><thead><tr><th>P</th><th>Fahrer</th><th>Status</th></tr></thead><tbody>${order().map((c,i)=>`<tr class="${c.team===0?'you':''}"><td>${i+1}</td><td>${esc(c.driver)}</td><td>${c.finish!==null?'Ziel':c.pitTimer>0?'BOX':Math.max(1,Math.min(12,Math.floor(c.progress)+1))+'/12'}</td></tr>`).join('')}</tbody></table>`;}
function tick(dt){if(!race||race.finished||race.paused)return;race.time+=dt;for(let c of race.cars){if(c.finish!==null)continue;if(c.pitTimer>0){c.pitTimer=Math.max(0,c.pitTimer-dt);continue;}let lap=Math.floor(Math.max(0,c.progress)),own=c.team===0;let style=own?race.style:'balanced',factor=style==='attack'?1.035:style==='save'?.97:1;let tyreAge=c.stopped?Math.max(0,lap-(own?race.pit:6)):lap;let tyreFactor=1-Math.max(0,tyreAge-3)*.008;let condition=own?.88+state.car.condition*.0012:1;let weatherFactor=race.weather==='rain'?.9+(c.consistency/100)*.06:1;let speed=(.065+c.strength*.00065)*factor*tyreFactor*condition*weatherFactor;let stopLap=own?race.pit:6+(c.number%3-1);if(!c.stopped&&c.progress>=stopLap){c.stopped=true;c.pitTimer=own?Math.max(.75,1.7-state.staff.mechanic*.09):1.35+Math.random()*.4;if(own)race.message=c.driver+' kommt zum Pflichtstopp.';continue;}if(lap!==c.incidentLap){c.incidentLap=lap;let reliability=own?clamp(state.car.reliability+state.staff.mechanic,0,100):80;let chance=(100-reliability)*.0006+(100-c.consistency)*.00035+(style==='attack'?.02:0)+(race.weather==='rain'?.012:0);if(Math.random()<chance){c.pitTimer=.7+Math.random()*1.5;if(own)race.message='Zeitverlust für '+c.driver+': '+(Math.random()<.5?'kleiner Fahrfehler.':'technisches Problem.');}}let prev=c.progress;c.progress+=speed*dt;if(c.progress>=12){c.finish=race.time-dt+(12-prev)/speed;c.progress=12;}}
if(race.cars.every(c=>c.finish!==null))finishRace();if(page==='race'){let timing=$('#timing');if(timing)timing.innerHTML=timingHTML();let lap=$('#raceLap');if(lap)lap.textContent=race.finished?'RENNEN BEENDET':'RUNDE '+Math.min(12,Math.max(1,Math.floor(Math.max(...race.cars.map(c=>c.progress)))+1))+' / 12 · '+(race.weather==='rain'?'REGEN':'TROCKEN');if($('#raceMessage'))$('#raceMessage').textContent=race.message;}}
function finishRace(){if(race.finished)return;race.finished=true;let sorted=order(),own=sorted.map((c,i)=>({c,p:i+1})).filter(x=>x.c.team===0);sorted.forEach((c,i)=>state.standings[c.team]+=points[i]);let best=Math.min(...own.map(x=>x.p)),prize=own.reduce((a,x)=>a+Math.round(390000-(x.p-1)*21000),0),sponsorPay=state.sponsor?state.sponsor.base+(best<=state.sponsor.target?state.sponsor.bonus:0):0,marketing=count('marketing')*22000,net=prize+sponsorPay+marketing-upkeep()-40000;state.cash+=net;state.xp+=80+(best<=3?50:0);state.rep+=Math.max(2,14-best)+count('academy');state.races++;state.wins+=own.filter(x=>x.p===1).length;state.podiums+=own.filter(x=>x.p<=3).length;state.car.condition=clamp(state.car.condition-(race.style==='attack'?20:race.style==='save'?11:15),0,100);if(state.sponsor&&!--state.sponsor.left)state.sponsor=null;let p1=own.find(x=>x.c.number===26).p,p2=own.find(x=>x.c.number===27).p;state.history.push({season:state.season,track:tracks[state.round].name,p1,p2,reward:net});state.history=state.history.slice(-24);race.message=`Ziel! ${state.name}: P${p1} & P${p2}. Netto-Einnahmen: ${money(net)}.`;log(race.message);state.round++;if(state.round===6){let rank=1+state.standings.slice(1).filter(p=>p>state.standings[0]).length;let bonus=1100000-(rank-1)*120000;state.cash+=bonus;state.xp+=250;log('Saison '+state.season+' beendet: Konstrukteursplatz '+rank+'. Saisonbonus '+money(bonus)+'.');race.message+=' Saison beendet: Platz '+rank+' · Bonus '+money(bonus)+'.';state.season++;state.round=0;race.championship=state.standings.slice();state.standings=[0,0,0,0,0,0];}save();toast(race.message);if(page==='race')render();else header();}
let prevTime=0,uiElapsed=0;function animate(now){let dt=prevTime?Math.min((now-prevTime)/1000,.1):0;prevTime=now;if(race&&!race.finished&&!race.paused){tick(dt*state.settings.speed);uiElapsed+=dt;}if(page==='race'&&race)drawTrack();requestAnimationFrame(animate);}requestAnimationFrame(animate);
function mutate(fn){if(race&&!race.finished){toast('Beende das laufende Rennen zuerst.');return;}fn();save();render();}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){page=b.dataset.page;selected=null;render();return;}if(b.dataset.build){buildMode=b.dataset.build;selected=null;render();return;}if(b.dataset.tile){let key=b.dataset.tile,[x,y]=key.split(',').map(Number);if(x>=state.cols||y>=state.rows){toast('Kaufe zuerst die nächste Grundstückserweiterung.');return;}if(state.tiles[key]){selected=key;render();return;}mutate(()=>{let t=buildings[buildMode];if(spend(t.cost)){state.tiles[key]={type:buildMode,level:1};selected=key;log(t.name+' auf dem Campus gebaut.');toast(t.name+' ist betriebsbereit.');}});return;}if(b.dataset.hire)mutate(()=>{let k=b.dataset.hire;if(state.staff[k]<20&&spend(k==='engineer'?80000:55000)){state.staff[k]++;toast('Neues Crewmitglied eingestellt.');}});if(b.dataset.train!==undefined)mutate(()=>{let d=state.drivers[Number(b.dataset.train)];if(count('sim')&&spend(45000)){d.skill=Math.min(100,d.skill+trainingGain());d.consistency=Math.min(100,d.consistency+2);state.trained++;toast('Training abgeschlossen.');}});if(b.dataset.recruit!==undefined)mutate(()=>{let d=state.drivers[Number(b.dataset.recruit)];if(spend(350000+(state.season-1)*70000)){d.name=['Nico Anders','Luca Marin','Ari Novak','Sam Rivera'][Math.floor(Math.random()*4)];d.skill=Math.min(95,Math.max(d.skill,65+Math.min(25,state.season*3)));d.consistency=Math.max(d.consistency,72);toast('Neues Talent verpflichtet.');}});if(b.dataset.research)mutate(()=>{let k=b.dataset.research;if(count('lab')&&state.staff.engineer&&state.car[k]<100&&spend(researchCost(k))){state.car[k]=Math.min(100,state.car[k]+researchGain());state.researches++;toast('Upgrade installiert.');}});if(b.dataset.quest!==undefined)mutate(()=>{let i=Number(b.dataset.quest),q=quests[i];if(q.test()&&!state.claimed.includes(i)){state.claimed.push(i);state.cash+=q.reward;state.xp+=q.xp;log('Mission abgeschlossen: '+q.title);toast('Mission erfüllt! '+money(q.reward)+' & '+q.xp+' XP');}});if(b.dataset.sponsor!==undefined)mutate(()=>{if(!state.sponsor){state.sponsor={...sponsors()[Number(b.dataset.sponsor)],left:3};toast('Sponsorvertrag unterzeichnet.');}});let a=b.dataset.action;if(!a)return;if(a==='start'){startRace();return;}if(a==='pause'){if(race&&!race.finished){race.paused=!race.paused;render();}return;}if(a==='next'){if(race?.finished){race=null;render();}return;}if(a==='export'){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='zfc-empire-spielstand.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return;}if(a==='import'){if(race&&!race.finished){toast('Beende das Rennen vor dem Import.');return;}$('#importFile').click();return;}if(a==='reset'){if(confirm('Dein aktueller Spielstand wird ersetzt. Vorher über Export sichern. Wirklich neu beginnen?')){state=fresh();race=null;page='overview';selected=null;save();render();}return;}if(a==='save'){save();toast(storageOk?'Spielstand gespeichert.':'Speicherung blockiert. Bitte exportieren.');return;}
mutate(()=>{if(a==='expand'&&state.cols<12&&spend(expandCost())){state.cols+=2;state.rows+=2;state.expansions++;toast('Neues Bauland erschlossen.');}if(a==='upgrade'&&selected){let t=state.tiles[selected];if(t&&t.level<5&&t.type!=='road'&&spend(buildings[t.type].cost*t.level*.65)){t.level++;toast('Gebäude ausgebaut.');}}if(a==='demolish'&&selected){let t=state.tiles[selected];if(t&&confirm(buildings[t.type].name+' abreißen?')){state.cash+=Math.round(buildings[t.type].cost*.35);delete state.tiles[selected];selected=null;}}if(a==='repair'&&state.car.condition<100&&spend(repairCost())){state.car.condition=100;toast('Beide Autos sind bereit.');}if(a==='identity'){let name=$('#teamName').value.trim();if(!name){toast('Bitte gib deinem Team einen Namen.');return;}state.name=name;state.color=$('#teamColor').value;toast('Teamidentität gespeichert.');}});});
document.addEventListener('change',e=>{if(e.target.id==='speed'){state.settings.speed=Number(e.target.value);save();}if(e.target.id==='style'&&race&&!race.finished)race.style=e.target.value;if(e.target.id==='pit'&&race&&!race.finished){let next=Number(e.target.value);if(race.cars.some(c=>c.team===0&&c.stopped)){toast('Boxenstopp bereits erfolgt.');e.target.value=race.pit;}else race.pit=next;}});
$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(f.size>1000000)throw Error('Datei zu groß');let candidate=validate(JSON.parse(await f.text()));if(confirm('Aktuellen Spielstand durch den importierten Spielstand ersetzen?')){state=candidate;race=null;selected=null;save();render();toast('Spielstand erfolgreich importiert.');}}catch(err){toast('Import fehlgeschlagen: ungültiger ZFC-Spielstand.');}e.target.value='';});
window.addEventListener('beforeunload',e=>{if(race&&!race.finished){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
